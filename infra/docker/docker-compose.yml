# Decoyr full stack for a single Vultr Cloud Compute VM.
#
#   cd infra/docker && cp .env.example .env && docker compose build && docker compose up -d
#
# Trust boundaries:
# Networks (segmented so a compromise of one tier can't reach the next):
#   * edge      — caddy, web, api. Internet-facing; api reaches Vultr inference from here.
#   * data      — api, postgres. Internal (no internet). Only the api can reach the database.
#   * sandbox   — api, mcp-city, egress-proxy. Internal (no internet). The candidate-facing services
#                 cannot reach the database, the internet, or the cloud metadata endpoint.
#   * Candidate containers are NOT defined here. The api (orchestrator) creates one internal
#     per-run network, starts the hardened candidate on it, and attaches `decoyr-mcp-city` under
#     the alias `mcp-city`. The candidate can reach nothing but mcp-city.
#   * Only the api gets the Docker socket. Candidates never do. A compromise of the api is still
#     host-root (socket); see docs/security for the production mitigation (socket proxy / gVisor).
name: decoyr

x-common-env: &common-env
  DECOYR_INTERNAL_SIGNING_KEY: ${DECOYR_INTERNAL_SIGNING_KEY:?set DECOYR_INTERNAL_SIGNING_KEY in .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decoyr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: decoyr
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoyr -d decoyr"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: decoyr/api:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mcp-city: { condition: service_started }
      egress-proxy: { condition: service_started }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://decoyr:${POSTGRES_PASSWORD}@postgres:5432/decoyr
      VULTR_SERVERLESS_INFERENCE_API_KEY: ${VULTR_SERVERLESS_INFERENCE_API_KEY:-}
      VULTR_INFERENCE_BASE_URL: ${VULTR_INFERENCE_BASE_URL:-https://api.vultrinference.com/v1}
      DECOYR_MODEL: ${DECOYR_MODEL:-}
      DECOYR_ADMIN_TOKEN: ${DECOYR_ADMIN_TOKEN:-}
      DECOYR_PUBLIC_URL: ${DECOYR_PUBLIC_URL:-http://localhost}
      DECOYR_HOST_PROVIDER: ${DECOYR_HOST_PROVIDER:-vultr}
      DECOYR_SANDBOX: docker
      DECOYR_CANDIDATE_IMAGE: decoyr/candidate-agent:latest
      # Extra agent runtimes trials may select (comma-separated images already on the VM).
      DECOYR_CANDIDATE_IMAGES: ${DECOYR_CANDIDATE_IMAGES:-}
      DECOYR_MCP_CONTAINER: decoyr-mcp-city
      DECOYR_SANDBOX_MCP_URL: http://mcp-city:7100
      DECOYR_MCP_HEALTH_URL: http://mcp-city:7100/healthz
      DECOYR_EGRESS_HEALTH_URL: http://egress-proxy:7200/healthz
      TRIAL_MAX_SECONDS: ${TRIAL_MAX_SECONDS:-180}
      TRIAL_MEMORY_MB: ${TRIAL_MEMORY_MB:-512}
      TRIAL_CPU_QUOTA: ${TRIAL_CPU_QUOTA:-1.0}
      TRIAL_MAX_PIDS: ${TRIAL_MAX_PIDS:-128}
      TRIAL_MAX_TOOL_CALLS: ${TRIAL_MAX_TOOL_CALLS:-40}
      TRIAL_MAX_STEPS: ${TRIAL_MAX_STEPS:-16}
      TRIAL_DRILL_SECONDS: ${TRIAL_DRILL_SECONDS:-8}
      TRIAL_RATE_PER_HOUR: ${TRIAL_RATE_PER_HOUR:-60}
      DECOYR_MAX_CONCURRENT_RUNS: ${DECOYR_MAX_CONCURRENT_RUNS:-3}
      DECOYR_IP_ACTIONS_PER_10MIN: ${DECOYR_IP_ACTIONS_PER_10MIN:-30}
      DECOYR_IP_RUNS_PER_10MIN: ${DECOYR_IP_RUNS_PER_10MIN:-8}
      DECOYR_DAILY_MODEL_CALLS: ${DECOYR_DAILY_MODEL_CALLS:-3000}
      DECOYR_API_KEYS: ${DECOYR_API_KEYS:-}
      DECOYR_REASONING_EFFORT: ${DECOYR_REASONING_EFFORT:-low}
      DECOYR_MAX_TOKENS: ${DECOYR_MAX_TOKENS:-4096}
    volumes:
      # Trusted orchestrator only. Never mounted into candidate containers.
      - /var/run/docker.sock:/var/run/docker.sock
    # The api runs as uid 10002 (non-root); this grants it the socket's group. Find it with:
    #   stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"
    networks: [edge, data, sandbox]
    logging: *logging

  mcp-city:
    build:
      context: ../../services/mcp-city
      secrets: [npm_ca]
    image: decoyr/mcp-city:latest
    container_name: decoyr-mcp-city
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "7100"
      DECOYR_CONTROL_PLANE_URL: http://api:8000
      DECOYR_EGRESS_URL: http://egress-proxy:7200
    networks: [sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  egress-proxy:
    build:
      context: ../../services/egress-proxy
      secrets: [npm_ca]
    image: decoyr/egress-proxy:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "7200"
      DECOYR_CONTROL_PLANE_URL: http://api:8000
    networks: [sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    build:
      context: ../../apps/web
    image: decoyr/web:latest
    restart: unless-stopped
    depends_on: [api]
    environment:
      DECOYR_API_URL: http://api:8000
      # Canonical public origin for SEO metadata (robots/sitemap/metadataBase). Optional:
      # falls back to a neutral placeholder so no VM IP is baked into the image.
      DECOYR_PUBLIC_URL: ${DECOYR_PUBLIC_URL:-}
      NODE_ENV: production
    networks: [edge]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # --watch reloads the Caddyfile (and sites.d/) when the VM's git sync updates them.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    depends_on: [web, api]
    environment:
      DECOYR_DOMAIN: ${DECOYR_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy:/etc/caddy:ro
      # Non-secret ops status written by the VM's decoyr-ops-snapshot (served under /_ops/<token>/).
      - /srv/opsroot:/srv/opsroot:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    logging: *logging

  # Build-only: `docker compose --profile build build candidate-agent` (or `docker compose build`
  # with the profile enabled) produces the image the orchestrator launches per run.
  candidate-agent:
    profiles: ["build"]
    build:
      context: ../../services/candidate-agent
      secrets: [npm_ca]
    image: decoyr/candidate-agent:latest
    network_mode: none
    command: ["true"]

networks:
  edge:
    name: decoyr-edge
  data:
    name: decoyr-data
    internal: true
  sandbox:
    name: decoyr-sandbox
    internal: true

# Optional extra CA bundle for TLS-intercepting build proxies (empty by default; not needed on Vultr).
secrets:
  npm_ca:
    file: ${BUILD_CA_FILE:-./build-ca.pem}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
