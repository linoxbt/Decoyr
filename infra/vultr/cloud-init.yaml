#cloud-config
# Decoyr control plane VM (Ubuntu 24.04 LTS). Rendered by provision.sh, which substitutes
# __REPO_URL__, __REPO_REF__, __DECOYR_DOMAIN__ and __BOOTSTRAP_B64__ before upload.
#
# Secrets: the internal signing key, Postgres password and admin token are generated ON the VM.
# __BOOTSTRAP_B64__ carries only the optional Vultr Serverless Inference key, model and the ops
# status token; it is written to /etc/decoyr/bootstrap.env (0600) and merged into the compose .env.
# The metadata service that serves user-data is reachable from trusted containers only: candidates
# run on internal per-run networks with no route to it (tests/containment/run.sh checks this).
#
# Without SSH access, the VM manages itself:
#   * decoyr-sync (cron, every 2 min) pulls __REPO_REF__ and rebuilds/restarts when it changes;
#   * decoyr-ops-snapshot (cron, every minute) publishes boot/sync/container logs under
#     /_ops/<ops token>/ (served by a tiny boot server until Caddy is up, then by Caddy).
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - openssl
  - rsync
  - python3

write_files:
  - path: /etc/decoyr/bootstrap.env
    permissions: "0600"
    encoding: b64
    content: __BOOTSTRAP_B64__
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true,
        "userland-proxy": false
      }
  - path: /usr/local/bin/decoyr-cleanup
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Safety net for trial teardown (the orchestrator destroys run containers/networks itself).
      set -euo pipefail
      docker ps -aq --filter "label=decoyr.run" --filter "status=exited" | xargs -r docker rm -f >/dev/null 2>&1 || true
      docker ps -aq --filter "label=decoyr.run" --filter "status=dead" | xargs -r docker rm -f >/dev/null 2>&1 || true
      for net in $(docker network ls -q --filter "label=decoyr.run"); do
        attached=$(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' "$net" || true)
        others=$(echo "$attached" | tr ' ' '\n' | grep -v -e '^$' -e '^decoyr-mcp-city$' || true)
        if [ -z "$others" ]; then
          docker network disconnect -f "$net" decoyr-mcp-city >/dev/null 2>&1 || true
          docker network rm "$net" >/dev/null 2>&1 || true
        fi
      done
  - path: /usr/local/bin/decoyr-host
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Print <public-ip-with-dashes>.sslip.io for this VM (Vultr metadata, falling back to the first address).
      ip="$(curl -s -m 5 http://169.254.169.254/v1.json | jq -r '.interfaces[0].ipv4.address // empty' 2>/dev/null)"
      [ -n "$ip" ] || ip="$(hostname -I | awk '{print $1}')"
      echo "${ip//./-}.sslip.io"
  - path: /usr/local/bin/decoyr-bootcaddy
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # HTTPS status page during boot: a standalone Caddy serving /srv/opsroot on <ip>.sslip.io.
      # It shares the compose stack's certificate volume, so the stack's Caddy reuses the certificate.
      set -uo pipefail
      HOST="$(/usr/local/bin/decoyr-host)"
      mkdir -p /etc/decoyr
      printf '%s {\n\troot * /srv/opsroot\n\tfile_server\n}\n:80 {\n\troot * /srv/opsroot\n\tfile_server\n}\n' "$HOST" > /etc/decoyr/boot.Caddyfile
      docker volume create decoyr_caddy_data >/dev/null
      docker rm -f decoyr-bootcaddy >/dev/null 2>&1 || true
      docker run -d --name decoyr-bootcaddy --restart unless-stopped -p 80:80 -p 443:443 \
        -v /etc/decoyr/boot.Caddyfile:/etc/caddy/Caddyfile:ro -v /srv/opsroot:/srv/opsroot:ro \
        -v decoyr_caddy_data:/data caddy:2-alpine
  - path: /usr/local/bin/decoyr-env
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Create/refresh infra/docker/.env: generated secrets once, bootstrap keys and DOCKER_GID every time.
      set -euo pipefail
      cd /opt/decoyr/infra/docker
      setkv() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
      if [ ! -f .env ]; then
        cp .env.example .env
        setkv DECOYR_INTERNAL_SIGNING_KEY "$(openssl rand -hex 32)"
        setkv POSTGRES_PASSWORD "$(openssl rand -hex 24)"
        setkv DECOYR_ADMIN_TOKEN "$(openssl rand -hex 16)"
        DOMAIN="__DECOYR_DOMAIN__"
        # "auto": HTTPS on <public-ip>.sslip.io, a free hostname that resolves to this VM.
        if [ "$DOMAIN" = "auto" ]; then DOMAIN="$(/usr/local/bin/decoyr-host)"; fi
        setkv DECOYR_DOMAIN "$DOMAIN"
        if [ "$DOMAIN" != ":80" ]; then setkv DECOYR_PUBLIC_URL "https://$DOMAIN"; fi
      fi
      chmod 600 .env
      if [ -s /etc/decoyr/bootstrap.env ]; then
        while IFS='=' read -r k v; do
          case "$k" in
            VULTR_SERVERLESS_INFERENCE_API_KEY|DECOYR_MODEL|DECOYR_REASONING_EFFORT|DECOYR_MAX_TOKENS|DECOYR_ADMIN_TOKEN) [ -n "$v" ] && setkv "$k" "$v" ;;
          esac
        done < /etc/decoyr/bootstrap.env
      fi
      setkv DOCKER_GID "$(stat -c %g /var/run/docker.sock)"
  - path: /usr/local/bin/decoyr-sync
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Pull-based deploy: rebuild and restart when the tracked branch moves.
      set -euo pipefail
      REF="__REPO_REF__"
      cd /opt/decoyr
      git fetch -q --depth 1 origin "$REF"
      TARGET="$(git rev-parse FETCH_HEAD)"
      LAST="$(cat /etc/decoyr/last-deployed 2>/dev/null || true)"
      # Redeploy when the branch moved OR the last deploy didn't finish (LAST not yet == TARGET).
      if [ "$TARGET" = "$LAST" ] && [ "${1:-}" != "--force" ]; then exit 0; fi
      echo "[$(date -u +%FT%TZ)] deploying $(git rev-parse --short "$TARGET")"
      git reset -q --hard "$TARGET"
      /usr/local/bin/decoyr-env
      cd infra/docker
      docker compose --profile build build
      docker rm -f decoyr-bootcaddy >/dev/null 2>&1 || true
      if ! docker compose up -d --remove-orphans; then
        docker compose stop caddy >/dev/null 2>&1 || true
        /usr/local/bin/decoyr-bootcaddy >/dev/null 2>&1 || true
        echo "[$(date -u +%FT%TZ)] compose up FAILED; boot status page restored"; exit 1
      fi
      git -C /opt/decoyr rev-parse HEAD > /etc/decoyr/last-deployed
      echo "[$(date -u +%FT%TZ)] deployed $(git -C /opt/decoyr rev-parse --short HEAD)"
  - path: /usr/local/bin/decoyr-ops-snapshot
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Publish non-secret operational status for debugging without SSH (no .env, no keys).
      set -uo pipefail
      TOKEN="$(sed -n 's/^DECOYR_OPS_TOKEN=//p' /etc/decoyr/bootstrap.env 2>/dev/null)"
      [ -n "$TOKEN" ] || exit 0
      D="/srv/opsroot/_ops/$TOKEN"; mkdir -p "$D"
      tail -n 400 /var/log/cloud-init-output.log > "$D/cloud-init.txt" 2>/dev/null
      tail -n 400 /var/log/decoyr-sync.log > "$D/sync.txt" 2>/dev/null
      { date -u; git -C /opt/decoyr log -1 --oneline 2>/dev/null; echo; docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null; echo; docker network ls 2>/dev/null; } > "$D/status.txt"
      if [ -d /opt/decoyr/infra/docker ]; then
        (cd /opt/decoyr/infra/docker && docker compose logs --tail 250 --no-color api mcp-city egress-proxy web 2>&1) > "$D/logs.txt"
      fi
      docker logs --tail 60 decoyr-bootcaddy > "$D/bootcaddy.txt" 2>&1 || true
      printf '<pre>Decoyr ops\n\n<a href="status.txt">status.txt</a>\n<a href="cloud-init.txt">cloud-init.txt</a>\n<a href="sync.txt">sync.txt</a>\n<a href="logs.txt">logs.txt</a></pre>\n' > "$D/index.html"
  - path: /etc/cron.d/decoyr
    permissions: "0644"
    content: |
      */15 * * * * root /usr/local/bin/decoyr-cleanup
      */2 * * * * root flock -n /run/decoyr-sync.lock /usr/local/bin/decoyr-sync >> /var/log/decoyr-sync.log 2>&1
      * * * * * root /usr/local/bin/decoyr-ops-snapshot

runcmd:
  # 2 GB swap so image builds fit on small plans (e.g. vc2-2c-4gb).
  - [bash, -c, "if ! swapon --show | grep -q /swapfile; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi"]
  # Boot status page on :80 until Caddy takes over (same /_ops/<token>/ path).
  - [bash, -c, "mkdir -p /srv/opsroot && printf '<!doctype html><title>decoyr</title>ok' > /srv/opsroot/index.html && /usr/local/bin/decoyr-ops-snapshot; systemd-run --unit=decoyr-bootlog python3 -m http.server 80 --directory /srv/opsroot"]
  - [bash, -c, "(while sleep 20; do /usr/local/bin/decoyr-ops-snapshot; done) >/dev/null 2>&1 &"]
  - [bash, -c, "curl -fsSL https://get.docker.com | sh"]
  - [systemctl, enable, --now, docker]
  # Switch the status page to HTTPS (<ip>.sslip.io) as soon as Docker is up.
  - [bash, -c, "systemctl stop decoyr-bootlog || true; /usr/local/bin/decoyr-bootcaddy"]
  - [bash, -c, "git clone --depth 1 --branch '__REPO_REF__' '__REPO_URL__' /opt/decoyr || git clone --depth 1 '__REPO_URL__' /opt/decoyr"]
  - - bash
    - -c
    - |
      set -euo pipefail
      /usr/local/bin/decoyr-env
      cd /opt/decoyr/infra/docker
      docker compose --profile build build
      docker rm -f decoyr-bootcaddy >/dev/null 2>&1 || true
      docker compose up -d || { docker compose stop caddy || true; /usr/local/bin/decoyr-bootcaddy; exit 1; }
      /usr/local/bin/decoyr-ops-snapshot
final_message: "Decoyr VM ready after $UPTIME seconds"
